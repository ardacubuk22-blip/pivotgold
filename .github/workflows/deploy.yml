name: Deploy to GitHub Pages

on:
  push:
      branches: [ main ]
        workflow_dispatch:

        permissions:
          contents: write
            pages: write
              id-token: write

              concurrency:
                group: "pages"
                  cancel-in-progress: false

                  jobs:
                    build:
                        runs-on: ubuntu-latest
                            steps:
                                  - name: Checkout
                                          uses: actions/checkout@v4

                                                - name: Fix JSX duplicate tags
                                                        run: |
                                                                  for f in src/components/Cart.tsx src/components/ProductDetail.tsx src/pages/CategoryPage.tsx; do
                                                                              if [ -f "$f" ]; then
                                                                                            sed -i 's|</svg>svg>|</svg>|g' "$f"
                                                                                                          sed -i 's|</div>div>|</div>|g' "$f"
                                                                                                                        sed -i 's|</p>p>|</p>|g' "$f"
                                                                                                                                      sed -i 's|</button>button>|</button>|g' "$f"
                                                                                                                                                    sed -i 's|</h2>h2>|</h2>|g' "$f"
                                                                                                                                                                  sed -i 's|</h1>h1>|</h1>|g' "$f"
                                                                                                                                                                                sed -i 's|</span>span>|</span>|g' "$f"
                                                                                                                                                                                              sed -i 's|</Link>Link>|</Link>|g' "$f"
                                                                                                                                                                                                            sed -i 's|</React.Fragment>React.Fragment>|</React.Fragment>|g' "$f"
                                                                                                                                                                                                                          sed -i '/^;{}<\//d' "$f"
                                                                                                                                                                                                                                        sed -i '/^;}<\//d' "$f"
                                                                                                                                                                                                                                                      sed -i '/^;[{k]<\//d' "$f"
                                                                                                                                                                                                                                                                    echo "Fixed $f"
                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                          done
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                - name: Setup Node
                                                                                                                                                                                                                                                                                                        uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                                                with:
                                                                                                                                                                                                                                                                                                                          node-version: 20
                                                                                                                                                                                                                                                                                                                                    cache: 'npm'
                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                          - name: Build
                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                            npm ci
                                                                                                                                                                                                                                                                                                                                                                      npm run build
                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                            - name: Upload artifact
                                                                                                                                                                                                                                                                                                                                                                                    uses: actions/upload-pages-artifact@v3
                                                                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                                                                      path: ./dist
                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                        deploy:
                                                                                                                                                                                                                                                                                                                                                                                                            environment:
                                                                                                                                                                                                                                                                                                                                                                                                                  name: github-pages
                                                                                                                                                                                                                                                                                                                                                                                                                        url: ${{ steps.deployment.outputs.page_url }}
                                                                                                                                                                                                                                                                                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                needs: build
                                                                                                                                                                                                                                                                                                                                                                                                                                    steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Deploy to GitHub Pages
                                                                                                                                                                                                                                                                                                                                                                                                                                                  id: deployment
                                                                                                                                                                                                                                                                                                                                                                                                                                                          uses: actions/deploy-pages@v4
